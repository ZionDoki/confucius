<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confucius</title>
    <link rel="stylesheet" href="workspace.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141c18;
      }
      body {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .pair {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #2a3b33;
        flex: 0 0 auto;
        min-width: 0;
        box-sizing: border-box;
      }
      .pair input {
        flex: 1 1 auto;
        min-width: 0;
        height: 32px;
        border-radius: 6px;
        border: 1px solid #3d5248;
        background: #1b2621;
        color: #f4efe6;
        padding: 0 8px;
      }
      .pair button {
        flex: 0 0 auto;
        background: #1f3a2e;
        color: #f4efe6;
        border: 1px solid #3d5248;
        border-radius: 6px;
        padding: 0 10px;
      }
      .workspace {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }
      @media (max-width: 340px) {
        .pair {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 6px;
          padding: 6px 8px;
        }
        .pair input {
          grid-column: 1 / -1;
        }
        .pair button {
          min-height: 32px;
        }
        #pair {
          grid-column: 1;
        }
        #push-tab {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="pair">
      <input
        id="token"
        placeholder="Pairing token from Zotero Confucius prefs"
      />
      <button id="pair">Pair</button>
      <button id="push-tab">This tab</button>
    </div>
    <div id="confucius-root" class="workspace"></div>
    <script src="vendor/katex.min.js"></script>
    <script src="markdown.js"></script>
    <script src="bridge-origin.js"></script>
    <script src="workspace-app.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
