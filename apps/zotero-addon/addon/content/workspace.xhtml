<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" data-confucius-window="">
  <head>
    <title>Confucius</title>
    <link
      id="confucius-palette-css"
      rel="stylesheet"
      href="chrome://__addonRef__/content/workspacePalette.css"
    />
    <style type="text/css">
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--confucius-paper);
        color: var(--confucius-ink);
        font:
          13px/1.45 Inter,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      #confucius-root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: var(--confucius-paper);
      }
      #confucius-loading {
        padding: 24px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="confucius-root">
      <div id="confucius-loading">Loading Confucius workspace…</div>
    </div>
  </body>
</html>
