<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-model-title"></html:h2></label>
    <html:p data-l10n-id="pref-model-help"></html:p>
    <label data-l10n-id="pref-base-url" />
    <html:input id="confucius-pref-baseUrl" type="text" width="400" />
    <label data-l10n-id="pref-api-key" />
    <html:input id="confucius-pref-apiKey" type="password" width="400" />
    <label data-l10n-id="pref-model" />
    <html:input id="confucius-pref-model" type="text" width="400" />
    <label data-l10n-id="pref-max-tokens" />
    <html:input id="confucius-pref-maxTokens" type="number" width="120" />
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-bridge-title"></html:h2></label>
    <html:p data-l10n-id="pref-bridge-help"></html:p>
    <html:input
      id="confucius-pref-pairingToken"
      type="text"
      readonly="true"
      width="400"
    />
    <label data-l10n-id="pref-mcp-json" />
    <html:textarea
      id="confucius-pref-mcpServersJson"
      rows="4"
      cols="60"
    ></html:textarea>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-runtime-title"></html:h2></label>
    <html:p data-l10n-id="pref-runtime-help"></html:p>
    <html:label>
      <html:input id="confucius-pref-pluginRuntimeHost" type="checkbox" />
      <html:span data-l10n-id="pref-runtime-host-enabled"></html:span>
    </html:label>
    <html:div id="confucius-pref-runtime-status"></html:div>
    <html:button
      id="confucius-pref-runtime-refresh"
      type="button"
      data-l10n-id="pref-runtime-refresh"
    ></html:button>
    <label data-l10n-id="pref-runtime-codex-path" />
    <html:div style="display: flex; gap: 6px; align-items: center">
      <html:input
        id="confucius-pref-codexExecutable"
        type="text"
        style="flex: 1 1 auto; min-width: 0"
      />
      <html:button
        id="confucius-pref-runtime-codex-browse"
        type="button"
        data-l10n-id="pref-runtime-browse"
      ></html:button>
      <html:button
        id="confucius-pref-runtime-codex-save"
        type="button"
        data-l10n-id="pref-runtime-save"
      ></html:button>
      <html:button
        id="confucius-pref-runtime-codex-auto"
        type="button"
        data-l10n-id="pref-runtime-auto"
      ></html:button>
    </html:div>
    <label data-l10n-id="pref-runtime-kimi-path" />
    <html:div style="display: flex; gap: 6px; align-items: center">
      <html:input
        id="confucius-pref-kimiExecutable"
        type="text"
        style="flex: 1 1 auto; min-width: 0"
      />
      <html:button
        id="confucius-pref-runtime-kimi-browse"
        type="button"
        data-l10n-id="pref-runtime-browse"
      ></html:button>
      <html:button
        id="confucius-pref-runtime-kimi-save"
        type="button"
        data-l10n-id="pref-runtime-save"
      ></html:button>
      <html:button
        id="confucius-pref-runtime-kimi-auto"
        type="button"
        data-l10n-id="pref-runtime-auto"
      ></html:button>
    </html:div>
    <html:p id="confucius-pref-runtime-error"></html:p>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-agent-title"></html:h2></label>
    <html:p data-l10n-id="pref-agent-help"></html:p>
    <html:label>
      <html:input id="confucius-pref-streamResponses" type="checkbox" />
      <html:span data-l10n-id="pref-stream-responses"></html:span>
    </html:label>
    <label data-l10n-id="pref-max-iterations" />
    <html:input id="confucius-pref-maxIterations" type="number" width="120" />
    <label data-l10n-id="pref-max-tool-calls" />
    <html:input id="confucius-pref-maxToolCalls" type="number" width="120" />
    <html:p data-l10n-id="pref-memory-location"></html:p>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-memory-title"></html:h2></label>
    <html:p data-l10n-id="pref-memory-help"></html:p>
    <label data-l10n-id="pref-memory-consent" />
    <html:select id="confucius-pref-memoryConsent" width="240">
      <html:option value="off" data-l10n-id="pref-memory-off"></html:option>
      <html:option
        value="review"
        data-l10n-id="pref-memory-review"
      ></html:option>
      <html:option value="auto" data-l10n-id="pref-memory-auto"></html:option>
    </html:select>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-security-title"></html:h2></label>
    <html:p data-l10n-id="pref-security-help"></html:p>
    <html:p data-l10n-id="pref-security-workspace"></html:p>
  </groupbox>
</vbox>
