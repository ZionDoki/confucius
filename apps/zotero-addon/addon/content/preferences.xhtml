<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="confucius-preferences"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <html:nav id="confucius-pref-tabs" class="confucius-settings-tabs"></html:nav>
  <groupbox data-confucius-pref-tab="appearance">
    <html:div id="confucius-pref-appearance"></html:div>
  </groupbox>
  <groupbox data-confucius-pref-tab="model">
    <label><html:h2 data-l10n-id="pref-model-title"></html:h2></label>
    <html:p data-l10n-id="pref-model-help"></html:p>
    <label data-l10n-id="pref-base-url" />
    <html:input id="confucius-pref-baseUrl" type="text" width="400" />
    <label data-l10n-id="pref-api-key" />
    <html:input id="confucius-pref-apiKey" type="password" width="400" />
    <label data-l10n-id="pref-model" />
    <html:input id="confucius-pref-model" type="text" width="400" />
    <label data-l10n-id="pref-max-tokens" />
    <html:input id="confucius-pref-maxTokens" type="number" width="120" />
  </groupbox>
  <groupbox data-confucius-pref-tab="security">
    <label><html:h2 data-l10n-id="pref-bridge-title"></html:h2></label>
    <html:p data-l10n-id="pref-bridge-help"></html:p>
    <html:input
      id="confucius-pref-pairingToken"
      type="text"
      readonly="true"
      width="400"
    />
    <html:p data-l10n-id="pref-mcp-token-help"></html:p>
    <html:input
      id="confucius-pref-mcpToken"
      type="text"
      readonly="true"
      width="400"
    />
    <html:p
      id="confucius-pref-mcpToken-status"
      data-l10n-id="pref-mcp-token-unavailable"
      hidden="true"
    ></html:p>
    <html:p data-l10n-id="pref-mcp-token-migration"></html:p>
    <label data-l10n-id="pref-mcp-json" />
    <html:textarea
      id="confucius-pref-mcpServersJson"
      rows="4"
      cols="60"
    ></html:textarea>
  </groupbox>
  <groupbox data-confucius-pref-tab="runtime">
    <html:div id="confucius-pref-runtime"></html:div>
  </groupbox>
  <groupbox data-confucius-pref-tab="model">
    <label><html:h2 data-l10n-id="pref-agent-title"></html:h2></label>
    <html:p data-l10n-id="pref-agent-help"></html:p>
    <html:label>
      <html:input id="confucius-pref-streamResponses" type="checkbox" />
      <html:span data-l10n-id="pref-stream-responses"></html:span>
    </html:label>
    <label data-l10n-id="pref-max-iterations" />
    <html:input id="confucius-pref-maxIterations" type="number" width="120" />
    <label data-l10n-id="pref-max-tool-calls" />
    <html:input id="confucius-pref-maxToolCalls" type="number" width="120" />
    <html:p data-l10n-id="pref-memory-location"></html:p>
  </groupbox>
  <groupbox data-confucius-pref-tab="memory">
    <label><html:h2 data-l10n-id="pref-memory-title"></html:h2></label>
    <html:p data-l10n-id="pref-memory-help"></html:p>
    <label data-l10n-id="pref-memory-consent" />
    <html:select id="confucius-pref-memoryConsent" width="240">
      <html:option value="off" data-l10n-id="pref-memory-off"></html:option>
      <html:option
        value="review"
        data-l10n-id="pref-memory-review"
      ></html:option>
    </html:select>
    <html:label
      ><html:input
        id="confucius-pref-historyAutoCleanup"
        type="checkbox" /><html:span
        data-l10n-id="pref-history-auto-cleanup"
      ></html:span
    ></html:label>
    <html:p data-l10n-id="pref-history-retention-help"></html:p>
  </groupbox>
  <groupbox data-confucius-pref-tab="security">
    <label><html:h2 data-l10n-id="pref-security-title"></html:h2></label>
    <html:p data-l10n-id="pref-security-help"></html:p>
    <html:p data-l10n-id="pref-security-workspace"></html:p>
  </groupbox>
  <groupbox data-confucius-pref-tab="update">
    <html:div id="confucius-pref-updates"></html:div>
  </groupbox>
</vbox>
